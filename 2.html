<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品展示 - 张俊翔</title>
    <style>
        :root {
            --main-bg: #0A1128;
            --accent-blue: #1C3D5A;
            --highlight-red: #FF4655;
            --cyber-green: #4BFFB3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Electrolize', sans-serif;
        }

        body {
            background: var(--main-bg);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(12, 20, 40, 0.9);
            backdrop-filter: blur(10px);
        }

        .logo img {
            width: 100px;
            height: 100px;
            margin-left: 59px;
        }

        .nav-links {
            line-height: 108px;
            font-size: 24px;
        }

        .nav-links a {
            margin-right: 50px;
            text-decoration: none;
            color: white;
        }

        /* 创新作品展示区 */
        .portfolio-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            padding: 3rem;
            flex: 1;
        }

        .project-card {
            background: rgba(28, 61, 90, 0.3);
            border: 1px solid var(--accent-blue);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            height: 500px;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(255, 70, 85, 0.2);
        }

        .project-image {
            height: 200px;
            overflow: hidden;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-image img {
            transform: scale(1.1);
        }

        .project-info {
            padding: 1.5rem;
            position: relative;
            height: calc(100% - 200px);
            display: flex;
            flex-direction: column;
        }

        .project-info h3 {
            color: var(--cyber-green);
            margin-bottom: 0.5rem;
        }

        .project-info p {
            flex-grow: 1;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            background: rgba(75, 255, 179, 0.1);
            color: var(--cyber-green);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .project-links {
            display: flex;
            gap: 1rem;
        }

        .project-link {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .demo-link {
            background: var(--highlight-red);
        }

        .code-link {
            background: var(--accent-blue);
        }

        .project-link:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        /* 3D悬浮效果 */
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 70, 85, 0.1) 100%);
            z-index: -1;
            border-radius: 10px;
            transform: translate3d(0, 0, 0);
            transition: all 0.3s ease;
        }

        .project-card:hover::before {
            transform: translate3d(5px, 5px, -10px);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .portfolio-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .logo img {
                width: 60px;
                height: 60px;
                margin-left: 20px;
            }

            .nav-links {
                line-height: normal;
                padding: 1rem 0;
            }

            .nav-links a {
                margin-right: 20px;
                font-size: 1rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="particles-js"></div>

    <nav class="nav-bar">
        <div class="logo"><img src="img/logo.png" alt="张俊翔的logo"></div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="#" class="active">作品展示</a>
            <a href="3.html">游戏博客</a>
            <a href="4.html">关于我</a>
        </div>
    </nav>

    <div class="portfolio-container">
        <!-- 项目1 -->
        <div class="project-card">
            <div class="project-image">
                <img src="img/电商.png" alt="电商数据分析平台">
            </div>
            <div class="project-info">
                <h3>电商数据分析平台</h3>
                <p>基于Python和Tableau构建的电商数据可视化分析平台，实现了销售趋势分析、用户行为分析和库存预测等功能。</p>
                <div class="project-tags">
                    <span class="tag">Python</span>
                    <span class="tag">Tableau</span>
                    <span class="tag">Pandas</span>
                    <span class="tag">机器学习</span>
                </div>
                <div class="project-links">
                    <a href="#" class="project-link demo-link"><i class="fas fa-eye"></i> 在线演示</a>
                    <a href="#" class="project-link code-link"><i class="fab fa-github"></i> 查看代码</a>
                </div>
            </div>
        </div>

       
        <!-- 项目2 -->
        <div class="project-card">
            <div class="project-image">
                <img src="img/情感.png" alt="社交媒体情感分析工具">
            </div>
            <div class="project-info">
                <h3>社交媒体情感分析工具</h3>
                <p>使用自然语言处理技术分析社交媒体文本情感倾向，为企业提供品牌声誉监测解决方案。</p>
                <div class="project-tags">
                    <span class="tag">NLP</span>
                    <span class="tag">Python</span>
                    <span class="tag">情感分析</span>
                    <span class="tag">Flask</span>
                </div>
                <div class="project-links">
                    <a href="#" class="project-link demo-link"><i class="fas fa-eye"></i> 在线演示</a>
                    <a href="#" class="project-link code-link"><i class="fab fa-github"></i> 查看代码</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="social-links">
                <a href="https://www.douyin.com/user/20816322314" target="_blank" aria-label="抖音">
                    <i class="fab fa-tiktok"></i>
                </a>

                &copy; 2025 张俊翔. 保留所有权利。

    <div id="wechatQR" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); 
         background: rgba(0,0,0,0.8); padding:20px; border-radius:10px; z-index:1000; text-align:center;">
        <p style="color:white; margin-bottom:10px;">扫码添加我的微信</p>
        <img src="../img/wechat-qr.jpg" alt="微信二维码" style="width:200px; height:200px; display:block; margin:0 auto;">
        <button onclick="document.getElementById('wechatQR').style.display='none'" 
                style="margin-top:15px; padding:5px 15px; background:var(--highlight-red); color:white; border:none; border-radius:5px;">
            关闭
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 80 },
                color: { value: '#1C3D5A' },
                shape: { type: 'circle' },
                opacity: { value: 0.5 },
                size: { value: 3 },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' }
                }
            }
        });

        function showWechatQR() {
            document.getElementById('wechatQR').style.display = 'block';
        }
    </script>
</body>
</html>
